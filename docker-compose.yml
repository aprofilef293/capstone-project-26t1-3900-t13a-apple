services:
  memgraph:
    image: memgraph/memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph
      - memgraph-log:/var/log/memgraph
    command: ["--log-level=TRACE"]
    environment:
      - MEMGRAPH_USER=${MEMGRAPH_USER:-memgraph}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-memgraph}

  backend:
    build:
      context: ./backend
      target: prod
    ports:
      - "8000:8000"
    environment:
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: "${MEMGRAPH_USER:-memgraph}"
      MEMGRAPH_PASSWORD: "${MEMGRAPH_PASSWORD:-memgraph}"
      CORS_ORIGINS: '["http://localhost:5173"]'
      EMBEDDING_HF_TOKEN: "${EMBEDDING_HF_TOKEN:-}"
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      GEMINI_ENABLED: "${GEMINI_ENABLED:-true}"
    depends_on:
      - memgraph
    volumes:
      - embedding-cache:/app/.embedding_cache
      - preprocessing-cache:/app/.preprocessing_cache
      - model-cache:/app/.model_cache
      - runtime-config:/app/.runtime_config

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  memgraph-data:
  memgraph-log:
  embedding-cache:
  preprocessing-cache:
  model-cache:
  runtime-config:
