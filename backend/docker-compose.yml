services:
  memgraph:
    image: memgraph/memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph
      - memgraph-log:/var/log/memgraph
    command: ["--log-level=TRACE"]
    env_file:
      - .env
    networks:
      - capstone

  backend:
    build:
      context: .
      target: prod
      args:
        - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MEMGRAPH_URI=bolt://memgraph:7687
    depends_on:
      - memgraph
    volumes:
      - embedding-cache:/app/.embedding_cache
      - preprocessing-cache:/app/.preprocessing_cache
      - model-cache:/app/.model_cache
      - runtime-config:/app/.runtime_config
    networks:
      - capstone

volumes:
  memgraph-data:
  memgraph-log:
  embedding-cache:
  preprocessing-cache:
  model-cache:
  runtime-config:

networks:
  capstone:
    name: capstone
    driver: bridge
