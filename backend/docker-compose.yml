services:
  memgraph:
    image: memgraph/memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph
      - memgraph-log:/var/log/memgraph
    command: ["--log-level=TRACE"]
    environment:
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=memgraph
    networks:
      - capstone

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    environment:
      - MEMGRAPH_URI=bolt://memgraph:7687
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=memgraph
      - LLM_API_URL=http://ollama:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=gemma3
      - CORS_ORIGINS=["http://localhost:5173"]
    depends_on:
      - memgraph
      - ollama
    volumes:
      - .:/app
      - /app/.venv
    networks:
      - capstone

volumes:
  memgraph-data:
  ollama-data:
  memgraph-log:

networks:
  capstone:
    name: capstone
    driver: bridge
