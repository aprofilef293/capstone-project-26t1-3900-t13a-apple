[project]
name = "obo-explorer-backend"
version = "0.1.0"
description = "FastAPI backend for OBO Ontology Explorer"
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry]
name = "obo-explorer-backend"
version = "0.1.0"
description = "FastAPI backend for OBO Ontology Explorer"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {version = ">=0.115.0", extras = ["standard"]}
uvicorn = {version = ">=0.34.0", extras = ["standard"]}
pydantic = ">=2.10.0"
pydantic-settings = ">=2.7.0"
neo4j = ">=5.27.0"
pronto = ">=2.5.0"
python-multipart = ">=0.0.18"
httpx = ">=0.28.0"
numpy = ">=1.26.0"
scipy = ">=1.11.0"
networkx = ">=3.2"
pandas = ">=2.1.0"
dask = {version = ">=2023.10.0", extras = ["dataframe"]}
numba = ">=0.58.0"
pyfftw = ">=0.13.0"
numba-kdtree = ">=0.3.0"
pygments = ">=2.20.0"
torch = {version = "^2.11.0", source = "pytorch"}
sentence-transformers = "^5.3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=1.0"
ruff = ">=0.8.0"


[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = ["integration: requires a running Memgraph instance"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
