[project]
name = "obo-explorer-backend"
version = "0.1.0"
description = "FastAPI backend for OBO Ontology Explorer"
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry]
name = "obo-explorer-backend"
version = "0.1.0"
description = "FastAPI backend for OBO Ontology Explorer"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {version = ">=0.115.0", extras = ["standard"]}
uvicorn = {version = ">=0.34.0", extras = ["standard"]}
pydantic = ">=2.10.0"
pydantic-settings = ">=2.7.0"
neo4j = ">=5.27.0"
pronto = ">=2.5.0"
python-multipart = ">=0.0.18"
httpx = ">=0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = ["integration: requires a running Memgraph instance"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
